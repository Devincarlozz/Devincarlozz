<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 455 265" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="p2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06121e" />
      <stop offset="60%" stop-color="#040b14" />
      <stop offset="100%" stop-color="#02060b" />
    </linearGradient>

    <linearGradient id="p2-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00c7b7" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="can-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#7dd3fc" />
      <stop offset="85%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>

    <linearGradient id="can-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <filter id="p2-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow-wave" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes floatCan {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(-2deg); }
    }
    @keyframes pulseRing {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.08); opacity: 0.8; }
    }
    .floating-can { animation: floatCan 5s ease-in-out infinite; transform-origin: 345px 125px; }
    .orbit-ring { animation: pulseRing 4s ease-in-out infinite; transform-origin: 345px 125px; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif; }
    .mono { font-family: 'Fira Code', Consolas, monospace; }
  </style>

  <!-- Background Card -->
  <rect x="2" y="2" width="451" height="261" rx="16" fill="url(#p2-bg)" stroke="url(#p2-border)" stroke-width="1.2" filter="url(#p2-shadow)" />

  <!-- Background Atmosphere -->
  <g opacity="0.08" stroke="#00f2fe" stroke-width="1">
    <circle cx="345" cy="125" r="70" fill="none" />
    <circle cx="345" cy="125" r="95" fill="none" />
    <line x1="20" y1="50" x2="435" y2="50" />
    <line x1="20" y1="210" x2="435" y2="210" />
  </g>

  <!-- Category Tag -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="138" height="24" rx="12" fill="#0f172a" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="12" cy="12" r="3" fill="#00f2fe" />
    <text x="22" y="16" class="mono" font-size="10" font-weight="600" fill="#7dd3fc" letter-spacing="0.5">3D WEB EXPERIENCE</text>
  </g>

  <!-- External Link Icon -->
  <g transform="translate(405, 24)" opacity="0.8">
    <circle cx="12" cy="12" r="12" fill="#1e293b" fill-opacity="0.8" />
    <path d="M 8,16 L 16,8 M 10,8 L 16,8 L 16,14" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Project Title & Subtitle -->
  <text x="24" y="82" class="sans" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Aqua Fresh 3D Showcase</text>
  <text x="24" y="106" class="sans" font-size="12.5" font-weight="400" fill="#94a3b8">Interactive 3D product showcase</text>
  <text x="24" y="124" class="sans" font-size="12.5" font-weight="400" fill="#94a3b8">with WebGL physics &amp; fluid animations</text>

  <!-- Tech Badges -->
  <g transform="translate(24, 150)">
    <!-- Three.js -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="76" height="25" rx="6" fill="#0f172a" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1" />
      <text x="38" y="16" class="sans" font-size="11" font-weight="600" fill="#7dd3fc" text-anchor="middle">Three.js</text>
    </g>
    <!-- React -->
    <g transform="translate(82, 0)">
      <rect x="0" y="0" width="62" height="25" rx="6" fill="#0f172a" stroke="#61dafb" stroke-opacity="0.3" stroke-width="1" />
      <text x="31" y="16" class="sans" font-size="11" font-weight="600" fill="#67e8f9" text-anchor="middle">React</text>
    </g>
    <!-- GSAP -->
    <g transform="translate(150, 0)">
      <rect x="0" y="0" width="62" height="25" rx="6" fill="#0f172a" stroke="#88ce02" stroke-opacity="0.3" stroke-width="1" />
      <text x="31" y="16" class="sans" font-size="11" font-weight="600" fill="#a3e635" text-anchor="middle">GSAP</text>
    </g>
  </g>

  <!-- Bottom Action Callout -->
  <g transform="translate(24, 218)">
    <text x="0" y="16" class="mono" font-size="11" font-weight="600" fill="#00f2fe">&gt; Launch Live Experience</text>
    <path d="M 165,12 L 173,12 L 169,8 M 173,12 L 169,16" stroke="#00f2fe" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ================= RIGHT SIDE: 3D CAN & ORBIT RINGS ================= -->
  <g class="floating-can">
    <!-- Glowing Orbit Rings -->
    <ellipse cx="345" cy="125" rx="68" ry="24" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-dasharray="4,3" transform="rotate(-15 345 125)" class="orbit-ring" opacity="0.6" />
    <ellipse cx="345" cy="125" rx="55" ry="18" fill="none" stroke="#00c7b7" stroke-width="1.4" transform="rotate(25 345 125)" class="orbit-ring" opacity="0.7" />

    <!-- 3D Can Body -->
    <g transform="translate(322, 60)">
      <!-- Can Shadow -->
      <ellipse cx="23" cy="128" rx="26" ry="7" fill="#000000" opacity="0.6" />

      <!-- Bottom Rim -->
      <ellipse cx="23" cy="106" rx="22" ry="6" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" />

      <!-- Cylinder Body -->
      <path d="M 1,22 L 1,106 C 1,112 45,112 45,106 L 45,22 Z" fill="url(#can-grad)" />

      <!-- Can Top Ellipse -->
      <ellipse cx="23" cy="22" rx="22" ry="6.5" fill="url(#can-top)" stroke="#7dd3fc" stroke-width="0.9" />
      <ellipse cx="23" cy="22" rx="17" ry="5" fill="#1e293b" />
      <!-- Can Pull Tab -->
      <rect x="21" y="19" width="5" height="7" rx="1.5" fill="#cbd5e1" />

      <!-- Can Graphics / Wave Lines -->
      <path d="M 1,48 Q 15,38 23,48 T 45,48" stroke="#ffffff" stroke-width="1.8" fill="none" opacity="0.85" filter="url(#glow-wave)" />
      <path d="M 1,56 Q 15,46 23,56 T 45,56" stroke="#00c7b7" stroke-width="1.5" fill="none" opacity="0.9" />

      <!-- Can Typography -->
      <text x="23" y="78" class="sans" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">AQUA</text>
      <text x="23" y="88" class="sans" font-size="7" font-weight="700" fill="#7dd3fc" text-anchor="middle" letter-spacing="0.5">FRESH</text>
      <text x="23" y="98" class="mono" font-size="5" font-weight="600" fill="#e0f2fe" text-anchor="middle">3D GL</text>

      <!-- Cylinder Highlight Specular Reflection -->
      <path d="M 9,23 L 9,107" stroke="#ffffff" stroke-width="2.5" opacity="0.45" stroke-linecap="round" />
      <path d="M 14,24 L 14,108" stroke="#ffffff" stroke-width="1.2" opacity="0.25" stroke-linecap="round" />
    </g>

    <!-- Floating Water / Energy Droplets -->
    <circle cx="308" cy="85" r="2.5" fill="#38bdf8" opacity="0.8" />
    <circle cx="378" cy="72" r="3" fill="#00f2fe" opacity="0.9" filter="url(#glow-wave)" />
    <circle cx="388" cy="148" r="2" fill="#00c7b7" opacity="0.7" />
    <circle cx="305" cy="155" r="2" fill="#7dd3fc" opacity="0.8" />
  </g>
</svg>
