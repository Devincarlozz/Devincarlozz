<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 455 265" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="p3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c22" />
      <stop offset="60%" stop-color="#0a0718" />
      <stop offset="100%" stop-color="#04030a" />
    </linearGradient>

    <linearGradient id="p3-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="portal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.9" />
    </linearGradient>

    <filter id="p3-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="portal-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a855f7" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    @keyframes portalFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes pulseGlowRing {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.9; }
    }
    .portal-window { animation: portalFloat 6s ease-in-out infinite; }
    .pulse-ring { animation: pulseGlowRing 3.5s ease-in-out infinite; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif; }
    .mono { font-family: 'Fira Code', Consolas, monospace; }
  </style>

  <!-- Background Card -->
  <rect x="2" y="2" width="451" height="261" rx="16" fill="url(#p3-bg)" stroke="url(#p3-border)" stroke-width="1.2" filter="url(#p3-shadow)" />

  <!-- Background Lines -->
  <g opacity="0.08" stroke="#c084fc" stroke-width="1">
    <line x1="20" y1="50" x2="435" y2="50" />
    <line x1="20" y1="130" x2="435" y2="130" />
    <line x1="20" y1="210" x2="435" y2="210" />
  </g>

  <!-- Category Tag -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="138" height="24" rx="12" fill="#0f172a" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="12" cy="12" r="3" fill="#c084fc" />
    <text x="22" y="16" class="mono" font-size="10" font-weight="600" fill="#e9d5ff" letter-spacing="0.5">FULLSTACK PLATFORM</text>
  </g>

  <!-- External Link Icon -->
  <g transform="translate(405, 24)" opacity="0.8">
    <circle cx="12" cy="12" r="12" fill="#1e293b" fill-opacity="0.8" />
    <path d="M 8,16 L 16,8 M 10,8 L 16,8 L 16,14" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Project Title & Subtitle -->
  <text x="24" y="82" class="sans" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="-0.3">AURA Internship Portal</text>
  <text x="24" y="106" class="sans" font-size="12.5" font-weight="400" fill="#94a3b8">Modern platform connecting students</text>
  <text x="24" y="124" class="sans" font-size="12.5" font-weight="400" fill="#94a3b8">with internships, matching &amp; tracking</text>

  <!-- Tech Badges -->
  <g transform="translate(24, 150)">
    <!-- React -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="62" height="25" rx="6" fill="#0f172a" stroke="#61dafb" stroke-opacity="0.3" stroke-width="1" />
      <text x="31" y="16" class="sans" font-size="11" font-weight="600" fill="#67e8f9" text-anchor="middle">React</text>
    </g>
    <!-- Node.js -->
    <g transform="translate(68, 0)">
      <rect x="0" y="0" width="70" height="25" rx="6" fill="#0f172a" stroke="#22c55e" stroke-opacity="0.3" stroke-width="1" />
      <text x="35" y="16" class="sans" font-size="11" font-weight="600" fill="#86efac" text-anchor="middle">Node.js</text>
    </g>
    <!-- MongoDB -->
    <g transform="translate(144, 0)">
      <rect x="0" y="0" width="80" height="25" rx="6" fill="#0f172a" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
      <text x="40" y="16" class="sans" font-size="11" font-weight="600" fill="#6ee7b7" text-anchor="middle">MongoDB</text>
    </g>
  </g>

  <!-- Bottom Action Callout -->
  <g transform="translate(24, 218)">
    <text x="0" y="16" class="mono" font-size="11" font-weight="600" fill="#c084fc">&gt; Explore Portal Architecture</text>
    <path d="M 185,12 L 193,12 L 189,8 M 193,12 L 189,16" stroke="#c084fc" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ================= RIGHT SIDE: MODERN GLASS DASHBOARD MOCKUP ================= -->
  <g transform="translate(258, 62)" class="portal-window">
    <!-- Main Window Frame -->
    <rect x="0" y="0" width="175" height="142" rx="10" fill="#0b0f19" fill-opacity="0.85" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.2" />

    <!-- Header bar -->
    <path d="M 0,10 Q 0,0 10,0 L 165,0 Q 175,0 175,10 L 175,26 L 0,26 Z" fill="#1e1b4b" fill-opacity="0.6" />
    <circle cx="12" cy="13" r="3.5" fill="#ef4444" />
    <circle cx="22" cy="13" r="3.5" fill="#f59e0b" />
    <circle cx="32" cy="13" r="3.5" fill="#10b981" />
    <text x="105" y="16" class="sans" font-size="9" font-weight="700" fill="#e9d5ff" text-anchor="middle">AURA • PORTAL</text>

    <!-- UI Stat mini cards -->
    <g transform="translate(10, 36)">
      <!-- Mini Card 1 -->
      <rect x="0" y="0" width="72" height="42" rx="6" fill="#1e1035" stroke="#a855f7" stroke-opacity="0.3" stroke-width="0.8" />
      <text x="8" y="16" class="sans" font-size="7.5" font-weight="500" fill="#c084fc">Applications</text>
      <text x="8" y="32" class="mono" font-size="13" font-weight="700" fill="#ffffff">1,248</text>
      <circle cx="60" cy="14" r="2.5" fill="#34d399" />

      <!-- Mini Card 2 -->
      <rect x="82" y="0" width="73" height="42" rx="6" fill="#1e1035" stroke="#f472b6" stroke-opacity="0.3" stroke-width="0.8" />
      <text x="90" y="16" class="sans" font-size="7.5" font-weight="500" fill="#f472b6">Matched</text>
      <text x="90" y="32" class="mono" font-size="13" font-weight="700" fill="#ffffff">98.4%</text>
      <circle cx="144" cy="14" r="2.5" fill="#60a5fa" />
    </g>

    <!-- Mini Opportunity Listing Bar -->
    <g transform="translate(10, 88)">
      <rect x="0" y="0" width="155" height="44" rx="6" fill="#131127" stroke="#312e81" stroke-width="0.8" />
      <!-- Company icon avatar -->
      <rect x="8" y="8" width="28" height="28" rx="6" fill="url(#portal-grad)" />
      <text x="22" y="26" class="sans" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">✦</text>

      <text x="44" y="20" class="sans" font-size="9" font-weight="700" fill="#f8fafc">Software Engineer Intern</text>
      <text x="44" y="31" class="mono" font-size="7.5" font-weight="500" fill="#94a3b8">Remote • Full-time • Stipend</text>

      <rect x="122" y="13" width="24" height="18" rx="4" fill="#a855f7" fill-opacity="0.25" stroke="#c084fc" stroke-width="0.6" />
      <text x="134" y="25" class="sans" font-size="8" font-weight="700" fill="#e9d5ff" text-anchor="middle">Apply</text>
    </g>
  </g>
</svg>
