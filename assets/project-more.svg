<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 455 265" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="p4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1020" />
      <stop offset="60%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>

    <linearGradient id="p4-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5" />
    </linearGradient>

    <radialGradient id="nebula" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <filter id="p4-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="star-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes orbitSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseRing {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.1); opacity: 0.85; }
    }
    .orbit-container { animation: orbitSpin 35s linear infinite; transform-origin: 345px 125px; }
    .pulse-ring { animation: pulseRing 4s ease-in-out infinite; transform-origin: 345px 125px; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif; }
    .mono { font-family: 'Fira Code', Consolas, monospace; }
  </style>

  <!-- Background Card -->
  <rect x="2" y="2" width="451" height="261" rx="16" fill="url(#p4-bg)" stroke="url(#p4-border)" stroke-width="1.2" filter="url(#p4-shadow)" />

  <!-- Ambient Glow -->
  <circle cx="345" cy="125" r="90" fill="url(#nebula)" />

  <!-- Background Lines -->
  <g opacity="0.08" stroke="#818cf8" stroke-width="1">
    <line x1="20" y1="50" x2="435" y2="50" />
    <line x1="20" y1="130" x2="435" y2="130" />
    <line x1="20" y1="210" x2="435" y2="210" />
  </g>

  <!-- Category Tag -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="132" height="24" rx="12" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="12" cy="12" r="3" fill="#818cf8" />
    <text x="22" y="16" class="mono" font-size="10" font-weight="600" fill="#c7d2fe" letter-spacing="0.5">OPEN SOURCE LAB</text>
  </g>

  <!-- External Link Icon -->
  <g transform="translate(405, 24)" opacity="0.8">
    <circle cx="12" cy="12" r="12" fill="#1e293b" fill-opacity="0.8" />
    <path d="M 8,16 L 16,8 M 10,8 L 16,8 L 16,14" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Project Title & Subtitle -->
  <text x="24" y="82" class="sans" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="-0.3">More Projects Coming Soon</text>
  <text x="24" y="106" class="sans" font-size="12.5" font-weight="400" fill="#94a3b8">Continuously architecting new tools,</text>
  <text x="24" y="124" class="sans" font-size="12.5" font-weight="400" fill="#94a3b8">3D simulations, and web applications</text>

  <!-- Tech Badges -->
  <g transform="translate(24, 150)">
    <!-- GitHub -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="68" height="25" rx="6" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1" />
      <text x="34" y="16" class="sans" font-size="11" font-weight="600" fill="#c7d2fe" text-anchor="middle">GitHub</text>
    </g>
    <!-- 20+ Repos -->
    <g transform="translate(74, 0)">
      <rect x="0" y="0" width="82" height="25" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
      <text x="41" y="16" class="sans" font-size="11" font-weight="600" fill="#7dd3fc" text-anchor="middle">20+ Repos</text>
    </g>
    <!-- Experiments -->
    <g transform="translate(162, 0)">
      <rect x="0" y="0" width="92" height="25" rx="6" fill="#0f172a" stroke="#34d399" stroke-opacity="0.3" stroke-width="1" />
      <text x="46" y="16" class="sans" font-size="11" font-weight="600" fill="#6ee7b7" text-anchor="middle">Experiments</text>
    </g>
  </g>

  <!-- Bottom Action Callout -->
  <g transform="translate(24, 218)">
    <text x="0" y="16" class="mono" font-size="11" font-weight="600" fill="#818cf8">&gt; Explore All Repositories</text>
    <path d="M 172,12 L 180,12 L 176,8 M 180,12 L 176,16" stroke="#818cf8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ================= RIGHT SIDE: CONSTELLATION ORBIT VISUAL ================= -->
  <!-- Outer Orbit Rings -->
  <circle cx="345" cy="125" r="58" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4,4" class="pulse-ring" />
  <circle cx="345" cy="125" r="40" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.5" />

  <!-- Center Core Star -->
  <circle cx="345" cy="125" r="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
  <text x="345" y="130" class="sans" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">+</text>

  <!-- Orbiting Constellation Nodes -->
  <g class="orbit-container">
    <!-- Node 1: CircuitLab / Labsim -->
    <g transform="translate(345, 70)">
      <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <circle cx="0" cy="0" r="3" fill="#38bdf8" filter="url(#star-glow)" />
    </g>
    <!-- Node 2: 3D Design -->
    <g transform="translate(398, 125)">
      <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
      <circle cx="0" cy="0" r="3" fill="#a855f7" filter="url(#star-glow)" />
    </g>
    <!-- Node 3: Digital Twin -->
    <g transform="translate(345, 180)">
      <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#34d399" stroke-width="1" />
      <circle cx="0" cy="0" r="3" fill="#34d399" filter="url(#star-glow)" />
    </g>
    <!-- Node 4: FIFA / Gaming -->
    <g transform="translate(292, 125)">
      <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
      <circle cx="0" cy="0" r="3" fill="#f59e0b" filter="url(#star-glow)" />
    </g>
  </g>
</svg>
