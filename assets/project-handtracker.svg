<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 455 265" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="p1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1e" />
      <stop offset="60%" stop-color="#050a16" />
      <stop offset="100%" stop-color="#03060d" />
    </linearGradient>

    <linearGradient id="p1-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="hud-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="p1-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="node-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes hudPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes trackHand {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(1deg); }
    }
    .hud-element { animation: hudPulse 3s ease-in-out infinite; }
    .hand-model { animation: trackHand 5s ease-in-out infinite; transform-origin: 345px 120px; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif; }
    .mono { font-family: 'Fira Code', Consolas, monospace; }
  </style>

  <!-- Background Card -->
  <rect x="2" y="2" width="451" height="261" rx="16" fill="url(#p1-bg)" stroke="url(#p1-border)" stroke-width="1.2" filter="url(#p1-shadow)" />

  <!-- Background Grid & HUD Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="20" y1="50" x2="435" y2="50" />
    <line x1="20" y1="130" x2="435" y2="130" />
    <line x1="20" y1="210" x2="435" y2="210" />
    <line x1="250" y1="20" x2="250" y2="245" />
  </g>

  <!-- Category Tag -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="12" cy="12" r="3" fill="#38bdf8" />
    <text x="22" y="16" class="mono" font-size="10" font-weight="600" fill="#93c5fd" letter-spacing="0.5">COMPUTER VISION</text>
  </g>

  <!-- External Link Icon -->
  <g transform="translate(405, 24)" opacity="0.8">
    <circle cx="12" cy="12" r="12" fill="#1e293b" fill-opacity="0.8" />
    <path d="M 8,16 L 16,8 M 10,8 L 16,8 L 16,14" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Project Title & Subtitle -->
  <text x="24" y="82" class="sans" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Hand Tracker</text>
  <text x="24" y="106" class="sans" font-size="12.5" font-weight="400" fill="#94a3b8">Real-time hand tracking application</text>
  <text x="24" y="124" class="sans" font-size="12.5" font-weight="400" fill="#94a3b8">with 21 landmark detection &amp; physics</text>

  <!-- Tech Badges -->
  <g transform="translate(24, 150)">
    <!-- Python -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="70" height="25" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
      <text x="35" y="16" class="sans" font-size="11" font-weight="600" fill="#7dd3fc" text-anchor="middle">Python</text>
    </g>
    <!-- OpenCV -->
    <g transform="translate(76, 0)">
      <rect x="0" y="0" width="74" height="25" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1" />
      <text x="37" y="16" class="sans" font-size="11" font-weight="600" fill="#67e8f9" text-anchor="middle">OpenCV</text>
    </g>
    <!-- MediaPipe -->
    <g transform="translate(156, 0)">
      <rect x="0" y="0" width="86" height="25" rx="6" fill="#0f172a" stroke="#34d399" stroke-opacity="0.3" stroke-width="1" />
      <text x="43" y="16" class="sans" font-size="11" font-weight="600" fill="#6ee7b7" text-anchor="middle">MediaPipe</text>
    </g>
  </g>

  <!-- Bottom Action Callout -->
  <g transform="translate(24, 218)">
    <text x="0" y="16" class="mono" font-size="11" font-weight="600" fill="#38bdf8">&gt; Explore Code &amp; Demo</text>
    <path d="M 148,12 L 156,12 L 152,8 M 156,12 L 152,16" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ================= RIGHT SIDE: HAND LANDMARK HUD VISUAL ================= -->
  <g transform="translate(265, 55)">
    <g class="hand-model" style="transform-origin: 82px 75px;">
      <!-- Camera Viewfinder Frame -->
      <rect x="0" y="0" width="165" height="150" rx="12" fill="#0b1329" fill-opacity="0.75" stroke="#1e293b" stroke-width="1" />

    <!-- Corner Target Crosshairs -->
    <path d="M 8,16 L 8,8 L 16,8" stroke="#38bdf8" stroke-width="1.8" fill="none" class="hud-element" />
    <path d="M 149,8 L 157,8 L 157,16" stroke="#38bdf8" stroke-width="1.8" fill="none" class="hud-element" />
    <path d="M 8,134 L 8,142 L 16,142" stroke="#38bdf8" stroke-width="1.8" fill="none" class="hud-element" />
    <path d="M 149,142 L 157,142 L 157,134" stroke="#38bdf8" stroke-width="1.8" fill="none" class="hud-element" />

    <!-- Live Status -->
    <g transform="translate(14, 18)">
      <circle cx="4" cy="4" r="3" fill="#22c55e" />
      <text x="12" y="7" class="mono" font-size="8.5" font-weight="600" fill="#4ade80">60 FPS • LIVE</text>
    </g>

    <!-- Hand Skeleton Wireframe Nodes -->
    <!-- Wrist -->
    <circle cx="82" cy="128" r="3.5" fill="#38bdf8" filter="url(#node-glow)" />

    <!-- Thumb -->
    <circle cx="56" cy="108" r="3" fill="#38bdf8" />
    <circle cx="44" cy="90" r="3" fill="#38bdf8" />
    <circle cx="42" cy="74" r="3.5" fill="#34d399" filter="url(#node-glow)" />

    <!-- Index Finger -->
    <circle cx="68" cy="85" r="3" fill="#38bdf8" />
    <circle cx="64" cy="62" r="3" fill="#38bdf8" />
    <circle cx="62" cy="42" r="3.5" fill="#34d399" filter="url(#node-glow)" />

    <!-- Middle Finger -->
    <circle cx="82" cy="80" r="3" fill="#38bdf8" />
    <circle cx="82" cy="55" r="3" fill="#38bdf8" />
    <circle cx="82" cy="34" r="3.5" fill="#34d399" filter="url(#node-glow)" />

    <!-- Ring Finger -->
    <circle cx="96" cy="84" r="3" fill="#38bdf8" />
    <circle cx="98" cy="62" r="3" fill="#38bdf8" />
    <circle cx="100" cy="44" r="3.5" fill="#34d399" filter="url(#node-glow)" />

    <!-- Pinky Finger -->
    <circle cx="110" cy="92" r="3" fill="#38bdf8" />
    <circle cx="116" cy="76" r="3" fill="#38bdf8" />
    <circle cx="120" cy="62" r="3.5" fill="#34d399" filter="url(#node-glow)" />

    <!-- Bone Connection Lines -->
    <g stroke="url(#hud-glow)" stroke-width="1.3" opacity="0.75" stroke-linecap="round">
      <!-- Wrist to Knuckles -->
      <line x1="82" y1="128" x2="56" y2="108" />
      <line x1="82" y1="128" x2="68" y2="85" />
      <line x1="82" y1="128" x2="82" y2="80" />
      <line x1="82" y1="128" x2="96" y2="84" />
      <line x1="82" y1="128" x2="110" y2="92" />
      <!-- Knuckle bridge -->
      <line x1="68" y1="85" x2="82" y2="80" />
      <line x1="82" y1="80" x2="96" y2="84" />
      <line x1="96" y1="84" x2="110" y2="92" />
      <!-- Thumb -->
      <line x1="56" y1="108" x2="44" y2="90" />
      <line x1="44" y1="90" x2="42" y2="74" />
      <!-- Index -->
      <line x1="68" y1="85" x2="64" y2="62" />
      <line x1="64" y1="62" x2="62" y2="42" />
      <!-- Middle -->
      <line x1="82" y1="80" x2="82" y2="55" />
      <line x1="82" y1="55" x2="82" y2="34" />
      <!-- Ring -->
      <line x1="96" y1="84" x2="98" y2="62" />
      <line x1="98" y1="62" x2="100" y2="44" />
      <!-- Pinky -->
      <line x1="110" y1="92" x2="116" y2="76" />
      <line x1="116" y1="76" x2="120" y2="62" />
    </g>

    <!-- Detection coordinates text -->
    <text x="82" y="142" class="mono" font-size="7.5" fill="#64748b" text-anchor="middle">TRACKING: 21 NODES OK</text>
    </g>
  </g>
</svg>
